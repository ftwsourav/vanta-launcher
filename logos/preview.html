<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Vanta Logos</title>
<style>
body{background:#0a0a0a;color:#fafafa;font-family:monospace;padding:20px;margin:0}
h1{font-size:22px;letter-spacing:3px;margin:0 0 4px}
.sub{color:#888;font-size:11px;margin-bottom:30px;letter-spacing:1px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;max-width:900px}
.card{background:#161616;border:1px solid #2a2a2a;padding:20px;display:flex;flex-direction:column;align-items:center;position:relative;min-height:280px}
.card .label{position:absolute;top:8px;left:12px;color:#666;font-size:9px;letter-spacing:2px;text-transform:uppercase}
img{max-width:220px;max-height:220px}
.cap{margin-top:14px;color:#FF6F00;font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:bold}
</style></head>
<body>
<h1>VANTA — 10 LOGO CONCEPTS</h1>
<div class="sub">Brutalist Windows Phone Metro-inspired · @ftwsourav</div>
<div class="grid">
  <div class="card"><div class="label">01 · METRO TILE V</div><img src="01_metro_tile_v.svg"><div class="cap">VANTA</div></div>
  <div class="card"><div class="label">02 · ACCENT BLOCK</div><img src="02_accent_block.svg"><div class="cap">VANTA</div></div>
  <div class="card"><div class="label">03 · WORDMARK</div><img src="03_wordmark.svg"><div class="cap">VANTA</div></div>
  <div class="card"><div class="label">04 · STACKED V</div><img src="04_stacked_v.svg"><div class="cap">VANTA</div></div>
  <div class="card"><div class="label">05 · SHARP V</div><img src="05_sharp_v.svg"><div class="cap">VANTA</div></div>
  <div class="card"><div class="label">06 · 4-TILE GRID</div><img src="06_four_tile.svg"><div class="cap">VANTA</div></div>
  <div class="card"><div class="label">07 · V + DOT</div><img src="07_v_dot.svg"><div class="cap">VANTA</div></div>
  <div class="card"><div class="label">08 · MINIMAL LINE</div><img src="08_minimal_line.svg"><div class="cap">VANTA</div></div>
  <div class="card"><div class="label">09 · HEX V</div><img src="09_hex_v.svg"><div class="cap">VANTA</div></div>
  <div class="card"><div class="label">10 · PIXEL V</div><img src="10_pixel_v.svg"><div class="cap">VANTA</div></div>
</div>
</body></html>
