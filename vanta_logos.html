<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vanta Logo Concepts</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0a;
    color: #fafafa;
    font-family: 'Courier New', monospace;
    padding: 40px 20px;
    min-height: 100vh;
  }
  h1 {
    font-weight: 900;
    letter-spacing: 2px;
    margin-bottom: 8px;
    font-size: 28px;
    text-transform: uppercase;
  }
  .sub {
    color: #888;
    font-size: 12px;
    margin-bottom: 40px;
    letter-spacing: 1px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 24px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .card {
    background: #161616;
    border: 1px solid #2a2a2a;
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 320px;
    position: relative;
    transition: border-color .2s;
  }
  .card:hover { border-color: #fafafa; }
  .label {
    position: absolute;
    top: 12px;
    left: 12px;
    color: #666;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .tag {
    position: absolute;
    bottom: 12px;
    right: 12px;
    color: #666;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  svg { display: block; }

  /* Concept 1: Metro tile V */
  .c1 .v {
    fill: #fafafa;
  }

  /* Concept 2: Accent brutalist block */
  .c2 .accent { fill: #FF6F00; }

  /* Concept 3: Monospace wordmark */
  .c3 text {
    font-family: 'Courier New', monospace;
    font-weight: 900;
  }
</style>
</head>
<body>
  <h1>VANTA — Logo Concepts</h1>
  <div class="sub">Brutalist Windows Phone Metro-inspired · @ftwsourav</div>

  <div class="grid">

    <!-- 1: Metro tile with V cutout -->
    <div class="card c1">
      <div class="label">01 · METRO TILE</div>
      <svg width="140" height="140" viewBox="0 0 140 140">
        <rect x="10" y="10" width="120" height="120" fill="#0a0a0a" stroke="#fafafa" stroke-width="3"/>
        <path class="v" d="M35 35 L70 105 L105 35 L88 35 L70 75 L52 35 Z"/>
      </svg>
      <div class="tag">VANTА</div>
    </div>

    <!-- 2: Accent brutalist block -->
    <div class="card c2">
      <div class="label">02 · ACCENT BLOCK</div>
      <svg width="140" height="140" viewBox="0 0 140 140">
        <rect x="10" y="10" width="120" height="120" class="accent"/>
        <path d="M35 40 L70 100 L105 40 L90 40 L70 78 L50 40 Z" fill="#0a0a0a"/>
      </svg>
      <div class="tag">VANTА</div>
    </div>

    <!-- 3: Monospace wordmark -->
    <div class="card c3">
      <div class="label">03 · WORDMARK</div>
      <svg width="200" height="80" viewBox="0 0 200 80">
        <text x="100" y="52" text-anchor="middle" font-size="48" fill="#fafafa" letter-spacing="6">VANTA</text>
        <rect x="20" y="62" width="160" height="3" fill="#FF6F00"/>
      </svg>
      <div class="tag">VANTА</div>
    </div>

    <!-- 4: Square V stack -->
    <div class="card">
      <div class="label">04 · STACKED V</div>
      <svg width="140" height="140" viewBox="0 0 140 140">
        <rect x="20" y="20" width="40" height="40" fill="#fafafa"/>
        <rect x="80" y="20" width="40" height="40" fill="#fafafa"/>
        <rect x="50" y="60" width="40" height="40" fill="#fafafa"/>
        <rect x="20" y="100" width="100" height="20" fill="#FF6F00"/>
      </svg>
      <div class="tag">VANTА</div>
    </div>

    <!-- 5: Sharp V geometric -->
    <div class="card">
      <div class="label">05 · SHARP V</div>
      <svg width="140" height="140" viewBox="0 0 140 140">
        <path d="M20 20 L70 120 L120 20 L100 20 L70 85 L40 20 Z" fill="#fafafa"/>
        <path d="M70 120 L70 140 L75 140 L75 122 Z" fill="#FF6F00"/>
      </svg>
      <div class="tag">VANTА</div>
    </div>

    <!-- 6: Window phone style 4 tiles -->
    <div class="card">
      <div class="label">06 · 4-TILE GRID</div>
      <svg width="140" height="140" viewBox="0 0 140 140">
        <rect x="15" y="15" width="50" height="50" fill="#FF6F00"/>
        <rect x="75" y="15" width="50" height="50" fill="#fafafa"/>
        <rect x="15" y="75" width="50" height="50" fill="#fafafa"/>
        <rect x="75" y="75" width="50" height="50" fill="#FF6F00"/>
        <text x="70" y="83" text-anchor="middle" font-size="20" fill="#0a0a0a" font-weight="900" font-family="Arial">V</text>
      </svg>
      <div class="tag">VANTА</div>
    </div>

    <!-- 7: V + dot -->
    <div class="card">
      <div class="label">07 · V + DOT</div>
      <svg width="140" height="140" viewBox="0 0 140 140">
        <path d="M25 30 L70 110 L115 30 L95 30 L70 80 L45 30 Z" fill="#fafafa"/>
        <circle cx="70" cy="125" r="8" fill="#FF6F00"/>
      </svg>
      <div class="tag">VANTА</div>
    </div>

    <!-- 8: Minimal V line -->
    <div class="card">
      <div class="label">08 · MINIMAL LINE</div>
      <svg width="160" height="120" viewBox="0 0 160 120">
        <path d="M20 20 L80 100 L140 20" stroke="#fafafa" stroke-width="6" fill="none" stroke-linecap="square" stroke-linejoin="miter"/>
        <path d="M20 20 L80 100 L140 20" stroke="#FF6F00" stroke-width="2" fill="none" stroke-linecap="square"/>
      </svg>
      <div class="tag">VANTА</div>
    </div>

    <!-- 9: Hex V -->
    <div class="card">
      <div class="label">09 · HEX V</div>
      <svg width="140" height="140" viewBox="0 0 140 140">
        <polygon points="70,10 130,40 130,100 70,130 10,100 10,40" fill="none" stroke="#fafafa" stroke-width="3"/>
        <path d="M40 45 L70 100 L100 45 L85 45 L70 75 L55 45 Z" fill="#FF6F00"/>
      </svg>
      <div class="tag">VANTА</div>
    </div>

    <!-- 10: Pixel V -->
    <div class="card">
      <div class="label">10 · PIXEL V</div>
      <svg width="140" height="140" viewBox="0 0 140 140">
        <rect x="20" y="20" width="20" height="20" fill="#fafafa"/>
        <rect x="40" y="40" width="20" height="20" fill="#fafafa"/>
        <rect x="60" y="60" width="20" height="20" fill="#fafafa"/>
        <rect x="80" y="40" width="20" height="20" fill="#fafafa"/>
        <rect x="100" y="20" width="20" height="20" fill="#fafafa"/>
        <rect x="60" y="80" width="20" height="20" fill="#FF6F00"/>
      </svg>
      <div class="tag">VANTА</div>
    </div>

  </div>
</body>
</html>
